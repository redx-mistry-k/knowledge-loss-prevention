<!DOCTYPE html>
<html lang="en">
<head>
  <title>KLP – Approval Queue</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="klp.css" rel="stylesheet" />
</head>

<body>
  <!-- Shared navbar injected by klp.js -->
  <script src="klp.js"></script>

  <main class="container" style="max-width: 960px;">
    <h3 class="page-title mb-4">Approval Queue</h3>

    <div id="queue"></div>
  </main>

  <script>
    async function loadApprovals() {
      const queue = document.getElementById("queue");
      queue.innerHTML = loadingCards(2).replace(/col-md-4/g, "col-12");

      try {
        const items = (await api("/approvals")) || [];

        if (items.length === 0) {
          queue.innerHTML = emptyStateHTML(
            "✅",
            "All clear",
            "No items pending approval."
          );
          return;
        }

        queue.innerHTML = items
          .map((i) => {
            const body = excerpt(i, 200);
            const creator = itemCreator(i);
            return `
    <div class="glass-card klp-hover mb-3">
      <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div style="flex: 1 1 320px; min-width: 0;">
          <small class="text-primary fw-bold">Project: ${esc(i.project_name || "-")}</small>
          <div class="d-flex flex-wrap align-items-center gap-2 mt-1">
            <strong>${esc(i.title)}</strong>
            ${statusBadge(i.status)}
          </div>
          ${body ? `<div class="text-muted mt-1" style="font-size: 0.85rem;">${esc(body)}</div>` : ""}
          ${creator ? `<div class="klp-meta mt-1">Submitted by ${esc(creator)}</div>` : ""}
        </div>

        <div class="d-flex gap-2">
          <a href="detail.html?id=${encodeURIComponent(i.id)}" class="btn btn-sm btn-outline-light">View</a>
          <button class="btn btn-sm btn-success" data-id="${esc(i.id)}" data-action="approve">Approve</button>
          <button class="btn btn-sm btn-outline-danger" data-id="${esc(i.id)}" data-action="reject">Reject</button>
        </div>
      </div>
    </div>`;
          })
          .join("");
      } catch (err) {
        queue.innerHTML = errorStateHTML(err.message);
      }
    }

    async function decide(id, action, btn) {
      const verb = action === "approve" ? "Approve" : "Reject";
      if (!confirm(`${verb} this item?`)) return;

      const card = btn.closest(".glass-card");
      card.querySelectorAll("button").forEach((b) => (b.disabled = true));

      try {
        await decideKnowledge(id, action);
        toast(action === "approve" ? "Item approved" : "Item rejected", "success");
        await loadApprovals();
      } catch (err) {
        toast(err.message || "Decision failed", "error");
        card.querySelectorAll("button").forEach((b) => (b.disabled = false));
      }
    }

    // Event delegation (buttons are re-rendered on every refresh)
    document.getElementById("queue").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      decide(btn.dataset.id, btn.dataset.action, btn);
    });

    initPage("approvals").then(loadApprovals);
  </script>
</body>
</html>
