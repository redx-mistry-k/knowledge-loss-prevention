<!DOCTYPE html>
<html lang="en">
<head>
  <title>KLP – Admin</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="klp.css" rel="stylesheet" />
</head>

<body>
  <!-- Shared navbar injected by klp.js -->
  <script src="klp.js"></script>

  <main class="container" style="max-width: 640px;">
    <h3 class="page-title mb-1">Admin</h3>
    <p class="text-muted mb-4">Add users and assign platform roles.</p>

    <form id="adminForm" class="glass-card p-4">
      <h5 class="mb-3">Add User</h5>

      <div class="mb-3">
        <label class="form-label" for="email">User email</label>
        <input
          id="email"
          class="form-control"
          placeholder="name@company.com"
          type="email"
          autocomplete="off"
          required
        />
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="pin">4-digit PIN</label>
          <input
            id="pin"
            class="form-control"
            placeholder="4-digit PIN"
            type="password"
            inputmode="numeric"
            pattern="[0-9]{4}"
            maxlength="4"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label" for="pin2">Confirm PIN</label>
          <input
            id="pin2"
            class="form-control"
            placeholder="Repeat PIN"
            type="password"
            inputmode="numeric"
            pattern="[0-9]{4}"
            maxlength="4"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="role">Role</label>
        <select id="role" class="form-select">
          <option value="member">Member</option>
          <option value="owner">Owner</option>
        </select>
        <div class="form-text">Owners can manage users and approve knowledge.</div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a href="index.html" class="btn btn-outline-light">Cancel</a>
        <button id="addBtn" class="btn btn-primary">Add User</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("adminForm");
    const addBtn = document.getElementById("addBtn");

    async function addUser(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const pin = document.getElementById("pin").value.trim();
      const pin2 = document.getElementById("pin2").value.trim();
      const role = document.getElementById("role").value;

      if (!/^\d{4}$/.test(pin)) {
        toast("PIN must be exactly 4 digits", "error");
        return;
      }
      if (pin !== pin2) {
        toast("PINs do not match", "error");
        return;
      }

      addBtn.disabled = true;
      const original = addBtn.textContent;
      addBtn.textContent = "Adding…";

      try {
        await api("/admin/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, pin, role })
        });

        toast("User added successfully", "success");
        form.reset();
      } catch (err) {
        toast(err.message || "Failed to add user", "error");
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = original;
      }
    }

    form.addEventListener("submit", addUser);

    // Only owners should use this page
    initPage("admin").then((me) => {
      if (me && me.isOwner === false) {
        document.querySelector("main").innerHTML = emptyStateHTML(
          "🔒",
          "Owners only",
          "You need the owner role to manage users.",
          '<a class="btn btn-outline-light btn-sm" href="index.html">Back to home</a>'
        );
      }
    });
  </script>
</body>
</html>
