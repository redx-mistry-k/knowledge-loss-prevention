<!DOCTYPE html>
<html lang="en">
<head>
  <title>KLP – Home</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="klp.css" rel="stylesheet" />
</head>

<body>
  <!-- Shared navbar injected by klp.js -->
  <script src="klp.js"></script>

  <main class="container">
    <!-- Search + Filter -->
    <div class="glass-bar d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <input
        id="search"
        class="form-control"
        style="flex: 1 1 240px;"
        placeholder="Search title, system, process area, description…"
        aria-label="Search knowledge"
      />

      <select id="statusFilter" class="form-select w-auto" aria-label="Filter by status">
        <option value="all">All statuses</option>
        <option value="Approved">Approved</option>
        <option value="Pending">Pending</option>
        <option value="Draft">Draft</option>
        <option value="Rejected">Rejected</option>
        <option value="Archived">Archived</option>
      </select>

      <span id="resultCount" class="klp-meta text-nowrap"></span>
    </div>

    <!-- Results -->
    <div id="results" class="row g-3"></div>
  </main>

  <script>
    const results = document.getElementById("results");
    const searchInput = document.getElementById("search");
    const statusFilter = document.getElementById("statusFilter");
    const resultCount = document.getElementById("resultCount");

    let allItems = [];
    let searchTimer = null;

    // ----------------------------
    // Render cards (XSS-safe)
    // ----------------------------
    function render(items) {
      resultCount.textContent =
        allItems.length > 0 ? `${items.length} of ${allItems.length} items` : "";

      if (items.length === 0) {
        results.innerHTML = emptyStateHTML(
          "🗂",
          allItems.length === 0 ? "No knowledge yet" : "No matches",
          allItems.length === 0
            ? "Be the first to capture critical knowledge for this project."
            : "Try a different search term or status filter.",
          allItems.length === 0
            ? '<a class="btn btn-primary btn-sm" href="submit.html">Submit knowledge</a>'
            : ""
        );
        return;
      }

      results.innerHTML = items
        .map((i) => {
          const body = excerpt(i);
          const creator = itemCreator(i);
          const date = itemDate(i);
          const metaBits = [creator ? `by ${creator}` : "", date].filter(Boolean).join(" · ");

          return `
  <div class="col-md-4">
    <div class="glass-card klp-hover h-100 d-flex flex-column">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
          <h5 class="card-title mb-0">${esc(i.title)}</h5>
          ${statusBadge(i.status)}
        </div>
        <p class="text-muted mb-1">${esc(i.system || i.process_area || "")}</p>
        ${body ? `<p class="card-excerpt text-muted mb-2">${esc(body)}</p>` : ""}
        ${metaBits ? `<div class="klp-meta">${esc(metaBits)}</div>` : ""}
      </div>

      <div class="card-footer mt-auto">
        <a href="detail.html?id=${encodeURIComponent(i.id)}" class="btn btn-sm btn-primary">
          View
        </a>
      </div>
    </div>
  </div>`;
        })
        .join("");
    }

    // ----------------------------
    // Filters (search + status)
    // ----------------------------
    function applyFilters() {
      const q = searchInput.value.trim().toLowerCase();
      const status = statusFilter.value;

      let filtered = allItems;

      if (status !== "all") {
        filtered = filtered.filter((i) => String(i.status).toLowerCase() === status.toLowerCase());
      }

      if (q) {
        // Search across title, system, process area and description
        filtered = filtered.filter((i) =>
          [i.title, i.system, i.process_area, pickField(i, ["description", "details", "body"])]
            .filter(Boolean)
            .some((field) => String(field).toLowerCase().includes(q))
        );
      }

      render(filtered);
    }

    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(applyFilters, 150);
    });
    statusFilter.addEventListener("change", applyFilters);

    // ----------------------------
    // Page init (ORDER MATTERS)
    // ----------------------------
    async function init() {
      results.innerHTML = loadingCards(6);

      await initPage("home"); // auth + navbar + admin check + project switcher

      try {
        allItems = (await getKnowledge()) || [];
        // newest first when timestamps exist
        allItems.sort((a, b) => String(itemDate(b)).localeCompare(String(itemDate(a))));
        applyFilters();
      } catch (err) {
        results.innerHTML = errorStateHTML(err.message);
      }
    }

    init();
  </script>
</body>
</html>
