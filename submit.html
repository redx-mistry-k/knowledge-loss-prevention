<!DOCTYPE html>
<html lang="en">
<head>
  <title>KLP – Submit Knowledge</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="klp.css" rel="stylesheet" />
</head>

<body>
  <!-- Shared navbar injected by klp.js -->
  <script src="klp.js"></script>

  <main class="container" style="max-width: 720px;">
    <h3 class="page-title mb-1">Submit Knowledge</h3>
    <p class="text-muted mb-4">
      Capture critical operational know-how so it survives handovers and departures.
    </p>

    <form id="submitForm" class="glass-card p-4">
      <div class="mb-3">
        <label class="form-label" for="f-title">Title *</label>
        <input id="f-title" class="form-control" placeholder="e.g. Server restart order" required maxlength="200" />
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="f-system">System / Tool</label>
          <input id="f-system" class="form-control" placeholder="e.g. Windows Server" maxlength="120" />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label" for="f-area">Process Area</label>
          <select id="f-area" class="form-select">
            <option>IT</option>
            <option>Finance</option>
            <option>HR</option>
            <option>Operations</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="f-description">Description *</label>
        <textarea
          id="f-description"
          class="form-control"
          rows="7"
          placeholder="Steps, runbooks, gotchas, context — the detail a colleague would need to reproduce this without you."
          required
          maxlength="5000"
        ></textarea>
        <div class="form-text"><span id="charCount">0</span>/5000</div>
      </div>

      <hr class="klp-divider" />

      <div class="d-flex flex-wrap gap-2 justify-content-end">
        <a href="index.html" class="btn btn-outline-light">Cancel</a>
        <button id="draftBtn" type="button" class="btn btn-outline-light">Save Draft</button>
        <button id="reviewBtn" type="submit" class="btn btn-primary">Submit for Review</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("submitForm");
    const draftBtn = document.getElementById("draftBtn");
    const reviewBtn = document.getElementById("reviewBtn");
    const description = document.getElementById("f-description");
    const charCount = document.getElementById("charCount");

    description.addEventListener("input", () => {
      charCount.textContent = description.value.length;
    });

    function collectPayload(status) {
      return {
        title: document.getElementById("f-title").value.trim(),
        system: document.getElementById("f-system").value.trim(),
        process_area: document.getElementById("f-area").value,
        description: description.value.trim(),
        status // "Draft" | "Pending" — ignored gracefully by backends without status support
      };
    }

    function validate(payload) {
      if (!payload.title) {
        toast("Title is required", "error");
        document.getElementById("f-title").focus();
        return false;
      }
      if (!payload.description) {
        toast("Description is required — it is the actual knowledge", "error");
        description.focus();
        return false;
      }
      return true;
    }

    async function save(status, btn) {
      const payload = collectPayload(status);
      if (!validate(payload)) return;

      const original = btn.textContent;
      btn.disabled = true;
      draftBtn.disabled = true;
      reviewBtn.disabled = true;
      btn.textContent = status === "Draft" ? "Saving…" : "Submitting…";

      try {
        await createKnowledge(payload);
        toast(
          status === "Draft" ? "Draft saved" : "Submitted for review",
          "success"
        );
        window.location.href = "my-items.html";
      } catch (err) {
        toast(err.message || "Could not save", "error");
        btn.disabled = false;
        draftBtn.disabled = false;
        reviewBtn.disabled = false;
        btn.textContent = original;
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      save("Pending", reviewBtn);
    });

    draftBtn.addEventListener("click", () => save("Draft", draftBtn));

    initPage("submit");
  </script>
</body>
</html>
