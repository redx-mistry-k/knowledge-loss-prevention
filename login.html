<!DOCTYPE html>
<html lang="en">
<head>
  <title>KLP – Login</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="klp.css" rel="stylesheet" />

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-card.login-card {
      width: 360px;
      max-width: calc(100vw - 2rem);
      padding: 2rem;
      text-align: center;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtext {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .error-text {
      font-size: 0.85rem;
      color: #ffb3b3;
      display: none;
    }

    .demo-hint {
      display: none;
      font-size: 0.8rem;
      border: 1px dashed rgba(255, 209, 102, 0.5);
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      color: #ffd166;
    }
  </style>
</head>

<body>
  <main class="glass-card login-card">
    <div class="brand mb-1">KLP</div>
    <div class="subtext mb-4">Knowledge Loss Prevention</div>

    <div id="error" class="error-text mb-2" role="alert">
      Invalid email or PIN
    </div>

    <!-- form enables Enter-key submit -->
    <form id="loginForm" novalidate>
      <div class="mb-3 text-start">
        <label for="email" class="form-label">Email address</label>
        <input
          id="email"
          class="form-control"
          placeholder="Email address"
          type="email"
          autocomplete="username"
          required
          autofocus
        />
      </div>

      <div class="mb-4 text-start">
        <label for="pin" class="form-label">PIN</label>
        <input
          id="pin"
          class="form-control"
          placeholder="4-digit PIN"
          type="password"
          inputmode="numeric"
          pattern="[0-9]{4}"
          maxlength="4"
          autocomplete="current-password"
          required
        />
      </div>

      <button id="loginBtn" class="btn btn-primary w-100" type="submit">
        Login
      </button>
    </form>

    <div id="demoHint" class="demo-hint mt-3">
      <span class="klp-demo-badge me-1">Demo</span>
      Demo credentials:
      <a href="#" id="fillDemo" class="link-warning">owner@klp.test</a> / 1234
    </div>
  </main>

  <script src="klp.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("error");
    const loginBtn = document.getElementById("loginBtn");

    async function doLogin() {
      const email = document.getElementById("email").value.trim();
      const pin = document.getElementById("pin").value.trim();

      errorBox.style.display = "none";

      if (!email || !pin) {
        errorBox.textContent = "Email and PIN are required";
        errorBox.style.display = "block";
        return;
      }

      if (!/^\d{4}$/.test(pin)) {
        errorBox.textContent = "PIN must be 4 digits";
        errorBox.style.display = "block";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in…";

      try {
        await login(email, pin);
        window.location.href = "index.html";
      } catch (err) {
        errorBox.textContent = err.message || "Invalid email or PIN";
        errorBox.style.display = "block";
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      doLogin();
    });

    // Show demo credentials hint only when running against the demo server
    fetch("/api/health")
      .then((r) => (r.ok ? r.json() : null))
      .then((info) => {
        if (info && info.demo) {
          document.getElementById("demoHint").style.display = "block";
        }
      })
      .catch(() => {});

    document.getElementById("fillDemo").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("email").value = "owner@klp.test";
      document.getElementById("pin").value = "1234";
      document.getElementById("pin").focus();
    });
  </script>
</body>
</html>
